name: Marketplace scheduled operations
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run reminders, expiry, rematching and notification retries
        run: curl --fail --show-error --silent --max-time 50 -H "Authorization: Bearer $CRON_SECRET" https://panditconnect-weld.vercel.app/api/cron/operations
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
