name: Encrypted database backup
on:
  schedule:
    - cron: "40 1 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install PostgreSQL backup client
        shell: bash
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
      - run: npm ci
      - run: npm run backup:create
        env:
          DIRECT_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          PG_DUMP_BIN: /usr/lib/postgresql/17/bin/pg_dump
      - name: Verify encrypted backup
        shell: bash
        run: npm run backup:verify -- "$(ls -1t .backups/*.dump.enc | head -1)"
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          PG_RESTORE_BIN: /usr/lib/postgresql/17/bin/pg_restore
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-pim-v2-${{ github.run_id }}
          path: .backups/*.dump.enc
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: error
